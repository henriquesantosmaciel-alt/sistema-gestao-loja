{% extends "base.html" %}
{% block title %}Erro {{ codigo }}{% endblock %}
{% block content %}
<div class="card" style="text-align:center; padding:60px;">
  <h1 style="font-size:48px;">{{ codigo }}</h1>
  <p class="muted">{{ mensagem }}</p>
  <a class="link" href="{{ url_for('dashboard') }}">Voltar ao dashboard</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card" style="text-align:center;">
    <h1>{{ codigo }}</h1>
    <p class="muted">{{ mensagem }}</p>
    <a class="link" href="{{ url_for('login') }}">Ir para o login</a>
  </div>
</div>
{% endblock %}
